weather:
  latitude: 44.9858
  longitude: -93.3594

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

jina:
  api-key: ${JINA_API_KEY:}

jwt:
  secret: ${JWT_SECRET:please-change-this-in-production-must-be-32-plus-chars!!}
  expiration-days: 30

server:
  error:
    include-message: always

logging:
  level:
    com.menuplanner.controller: DEBUG
    com.menuplanner.filter: INFO

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/menu_planner
    username: menu_user
    password: menu_pass
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
